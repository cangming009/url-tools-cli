[project]
name = "url-tools-cli"
version = "0.1.0"
description = "B站/YouTube视频字幕提取CLI工具"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
url-tools = "url_tools_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]