name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  binary-release:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: amd64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pip install build

      - name: Build
        run: |
          pip install -e .
          python -m PyInstaller --onefile --name url-tools src/url_tools_cli/__main__.py || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/url-tools*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}